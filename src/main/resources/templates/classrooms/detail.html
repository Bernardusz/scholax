<!doctype html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}"
>
<head>
</head>
<main layout:fragment="content" class="flex flex-col items-center justify-center p-6">
    <section class="w-full max-w-4xl">
        <div class="mb-6">
            <a th:href="@{/classrooms}" class="link-primary text-sm">← Back to Classrooms</a>
        </div>

        <div th:if="${error}" class="mb-4 p-4 bg-destructive/10 text-destructive border border-destructive/20 rounded-md">
            <p th:text="${error.message}">Error message</p>
        </div>

        <div class="p-8 rounded-2xl bg-card text-card-foreground border border-border shadow-md">
            <div class="flex items-start gap-6">
                <div th:if="${classroom.classroomCoverId != null}"
                     class="w-32 h-32 rounded-xl overflow-hidden border border-border flex-shrink-0">
                    <img th:src="@{'/uploads/' + ${classroom.classroomCoverId}}"
                         class="w-full h-full object-cover"
                         alt="Classroom Cover"/>
                </div>
                <div th:if="${classroom.classroomCoverId == null}"
                     class="w-32 h-32 rounded-xl bg-muted border border-border flex-shrink-0 flex items-center justify-center">
                    <span class="text-4xl">📚</span>
                </div>

                <div class="flex-1">
                    <h2 class="text-2xl font-bold" th:text="${classroom.name}">Classroom Name</h2>
                    <div class="mt-4 space-y-2">
                        <p class="text-sm text-muted-foreground">
                            <span class="font-medium">Invite Code:</span>
                            <span class="font-mono bg-muted px-2 py-0.5 rounded" th:text="${classroom.inviteCode}">ABC123</span>
                        </p>
                        <p class="text-sm text-muted-foreground">
                            <span class="font-medium">Created:</span>
                            <span th:text="${#temporals.format(classroom.createdAt, 'MMMM dd, yyyy')}">January 1, 2026</span>
                        </p>
                    </div>
                </div>
            </div>

            <div sec:authorize="hasAnyRole('ADMIN', 'TEACHER')" class="mt-8 pt-6 border-t border-border">
                <h3 class="font-semibold mb-4">Manage Classroom</h3>
                <div class="flex flex-wrap gap-3">
                    <form th:action="@{/classrooms/{id}/name(id=${classroom.id})}" method="POST" class="flex gap-2">
                        <input type="hidden" name="_method" value="PUT"/>
                        <input type="text" name="name" th:value="${classroom.name}" required
                               class="h-10 bg-background border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-primary/40 px-3" />
                        <button type="submit" class="btn-primary px-4 py-2 rounded-md font-semibold">
                            Update Name
                        </button>
                    </form>

                    <form th:action="@{/classrooms/{id}/cover(id=${classroom.id})}" method="POST" class="flex gap-2">
                        <input type="hidden" name="_method" value="PUT"/>
                        <input type="number" name="classroomCoverId" placeholder="Cover Image ID"
                               class="h-10 bg-background border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-primary/40 px-3" />
                        <button type="submit" class="btn-secondary px-4 py-2 rounded-md font-semibold">
                            Update Cover
                        </button>
                    </form>

                    <form th:action="@{/classrooms/{id}(id=${classroom.id})}" method="POST"
                          sec:authorize="hasRole('ADMIN')"
                          onsubmit="return confirm('Are you sure you want to delete this classroom?');">
                        <input type="hidden" name="_method" value="DELETE"/>
                        <button type="submit" class="btn-destructive px-4 py-2 rounded-md font-semibold">
                            Delete Classroom
                        </button>
                    </form>
                </div>
            </div>

            <div sec:authorize="hasAnyRole('ADMIN', 'TEACHER')" class="mt-8 pt-6 border-t border-border">
                <h3 class="font-semibold mb-4">Add User to Classroom</h3>
                <form th:action="@{/classrooms/{id}/users(id=${classroom.id})}" method="POST" class="flex gap-2">
                    <input type="number" name="userId" placeholder="User ID" required
                           class="h-10 bg-background border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-primary/40 px-3" />
                    <button type="submit" class="btn-primary px-4 py-2 rounded-md font-semibold">
                        Add User
                    </button>
                </form>
            </div>
        </div>
    </section>
</main>
</html>
