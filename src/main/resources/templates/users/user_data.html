<!doctype html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/layout}"
>
<head>
</head>
<main layout:fragment="content" class="flex flex-col items-center justify-center">
    <section class="section w-full max-w-4xl mx-auto p-6">
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
            <!-- Profile Header -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 p-8 text-white">
                <div class="flex items-center gap-6">
                    <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-lg">
                        <img th:with="picId=${userData.profilePictureId}"
                             th:src="${picId != null ? '/uploads/' + picId : '/images/default-avatar.png'}"
                             class="w-full h-full object-cover"
                             alt="Profile Picture"/>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold" th:text="${userData.fullName}">User Name</h1>
                        <p class="text-blue-100 text-sm mt-1" th:text="${userData.email}">user@example.com</p>
                        <span class="inline-block mt-2 px-3 py-1 bg-white/20 rounded-full text-xs font-medium"
                              th:text="${userData.role}">ROLE</span>
                    </div>
                </div>
            </div>

            <!-- Profile Details -->
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-gray-800">Profile Information</h2>
                    <div class="flex gap-3">
                        <a th:href="@{/users/{id}/information(id=${userData.id})}" 
                           class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors text-sm font-medium">
                            Edit Information
                        </a>
                        <a th:href="@{/users/{id}/password(id=${userData.id})}" 
                           class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition-colors text-sm font-medium">
                            Change Password
                        </a>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">User ID</label>
                            <p class="text-gray-900 font-medium" th:text="${userData.id}">-</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Full Name</label>
                            <p class="text-gray-900 font-medium" th:text="${userData.fullName}">-</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Email</label>
                            <p class="text-gray-900 font-medium" th:text="${userData.email}">-</p>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Role</label>
                            <p class="text-gray-900 font-medium" th:text="${userData.role}">-</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Member Since</label>
                            <p class="text-gray-900 font-medium" th:text="${#temporals.format(userData.createdAt, 'MMMM dd, yyyy')}">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Logout Section -->
            <div class="p-6 border-t border-gray-100 bg-gray-50">
                <form th:action="@{/logout}" method="POST" class="inline">
                    <button type="submit" class="text-sm font-medium text-red-600 hover:text-red-800 bg-transparent border-none cursor-pointer p-0">
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </section>
</main>
</html>
