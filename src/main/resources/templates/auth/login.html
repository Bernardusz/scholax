<!doctype html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/layout}"
>
<head>
</head>
<main layout:fragment="content" class="flex flex-col items-center justify-center">
    <section class="section flex flex-col items-center justify-center">
        <div class="w-full max-w-md p-8 rounded-2xl bg-card text-card-foreground border border-border shadow-md">
            <div class="text-left">
                <h2>Welcome Back</h2>
                <p class="p-deemphasize text-muted-foreground mt-1">Ready to face the storm? 🐧</p>
            </div>

            <div th:if="${param.error}" class="mb-4 p-3 bg-destructive/10 text-destructive border border-destructive/20 text-sm rounded-md">
                Invalid email or password. Please try again.
            </div>

            <form th:action="@{/login}" method="POST" class="flex flex-col gap-4">
                <div class="flex flex-col gap-1">
                    <label for="username" class="text-sm font-medium">Email Address</label>
                    <input type="email" id="username" name="username" required autocomplete="email"
                           class="h-10 bg-background border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-primary/40" />
                </div>

                <div class="flex flex-col gap-1">
                    <label for="password" class="text-sm font-medium">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="h-10 bg-background border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-primary/40" />
                </div>

                <button type="submit" class="btn-primary w-full rounded-md mt-2 font-semibold">
                    Sign In
                </button>
            </form>

            <div class="text-center mt-6 text-sm">
                <span class="text-muted-foreground">New here? </span>
                <a th:href="@{/register}" class="link-primary">Create an account</a>
            </div>
        </div>
    </section>

</main>
</html>
