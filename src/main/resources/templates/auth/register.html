<!doctype html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/layout}"
>
	<head></head>
	<main layout:fragment="content" class="flex flex-col items-center justify-center">
		<section class="section flex flex-col items-center justify-center">
	        <div class="w-full max-w-md p-8 rounded-2xl bg-card text-card-foreground border border-border shadow-md">
	            <div class="text-center mb-6">
	                <h1>Join Scholax</h1>
	                <p class="p-deemphasize text-muted-foreground mt-1">Get your credentials before assignments drop 💀</p>
	            </div>

	            <form th:action="@{/admins/users/create}" method="POST" class="flex flex-col gap-4">
	                <div class="flex flex-col gap-1">
	                    <label for="fullName" class="text-sm font-medium">Full Name</label>
	                    <input type="text" id="fullName" name="fullName" required autocomplete="name"
	                           class="h-10 bg-background border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-primary/40" />
	                </div>

	                <div class="flex flex-col gap-1">
	                    <label for="email" class="text-sm font-medium">Email Address</label>
	                    <input type="email" id="email" name="email" required autocomplete="email"
	                           class="h-10 bg-background border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-primary/40" />
	                </div>

	                <div class="flex flex-col gap-1">
	                    <label for="password" class="text-sm font-medium">Password</label>
	                    <input type="password" id="password" name="password" required autocomplete="new-password"
	                           class="h-10 bg-background border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-primary/40" />
	                </div>

                    <div class="flex flex-col gap-1">
		               	<label for="role">Choose the role</label>

		                <select name="role" id="role" class="border p-2 border-border rounded-md">
		                    <option value="ADMIN">ADMIN</option>
		                    <option value="TEACHER">TEACHER</option>
		                    <option value="STUDENT">STUDENT</option>
		                </select>
                    </div>

	                <button type="submit" class="btn-primary w-full rounded-md mt-2 font-semibold">
	                    Register
	                </button>
	            </form>

	            <div class="text-center mt-6 text-sm">
	                <span class="text-muted-foreground">Already have an account? </span>
	                <a th:href="@{/login}" class="link-primary">Sign in instead</a>
	            </div>
	        </div>
		</section>
	</main>
</html>
