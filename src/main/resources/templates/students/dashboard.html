<!doctype html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/layout}"
>
<head>
</head>
<main layout:fragment="content" class="flex flex-col items-center justify-center">
    <section class="section w-full max-w-6xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Student Dashboard</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">My Classrooms</h2>
                <p class="text-sm text-gray-500 mb-4">View your enrolled classrooms</p>
                <a th:href="@{/classrooms}" class="inline-block px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">View Classrooms</a>
            </div>
            
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">My Profile</h2>
                <p class="text-sm text-gray-500 mb-4">View and edit your profile information</p>
                <a th:href="@{/users/{id}(id=${#authentication.principal.id})}" class="inline-block px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors">View Profile</a>
            </div>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Recent Activity</h2>
            <p class="text-gray-500">No recent activity to display.</p>
        </div>
    </section>
</main>
